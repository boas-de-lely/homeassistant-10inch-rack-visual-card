      - type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        custom_fields:
          progress: |
            [[[
              const total =
                Number(states['sensor.storage_local_total_storage_2']?.state) +
                Number(states['sensor.storage_local_lvm_total_storage_2']?.state);
              const used =
                Number(states['sensor.storage_local_lvm_used_storage_2']?.state) +
                Number(states['sensor.storage_local_used_storage_2']?.state);
              const valid = Number.isFinite(total) && total > 0 && Number.isFinite(used);
              const pct = valid ? Math.max(0, Math.min(100, used / total * 100)) : 0;
              const label = valid ? `${Math.round(pct)}%` : '--%';

              const rawTemp = Number(states['sensor.pve2_kingston_ssd_temperatuur']?.state);
              const temp = Number.isFinite(rawTemp)
                ? `${Math.round(rawTemp)}°C`
                : '--°C';

              return `
                <div style="display:flex;justify-content:space-between;align-items:center;width:100%;font:700 8px Arial,sans-serif;color:#e2e8f0;line-height:10px;text-shadow:0 1px 2px #000;">
                  <span>${label}</span>
                  <span>${temp}</span>
                </div>
                <div style="width:100%;height:4px;margin-top:2px;background:#394150;border-radius:3px;overflow:hidden;">
                  <div style="width:${pct}%;height:100%;background:#fc6b03;border-radius:3px;"></div>
                </div>
              `;
            ]]]
        styles:
