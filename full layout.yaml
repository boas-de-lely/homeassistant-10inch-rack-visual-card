              const used = Number(states['sensor.storage_ssd2_used_storage_2']?.state);
              const valid = Number.isFinite(total) && total > 0 && Number.isFinite(used);
              const pct = valid ? Math.max(0, Math.min(100, used / total * 100)) : 0;
