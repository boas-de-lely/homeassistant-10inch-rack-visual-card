      - type: custom:button-card
        entity: binary_sensor.cloudflared___cc_status
        name: Cloudflared · _.cc
        icon: mdi:cloud-lock
        show_state: true
        state_display: |
          [[[
            const s = entity?.state;
            if (s === 'on' || s === 'running' || s === 'online') return 'ONLINE';
            if (s === 'off' || s === 'stopped' || s === 'offline') return 'OFFLINE';
            return (s || 'ONBEKEND').toUpperCase();
          ]]]
        tap_action:
          action: more-info
        styles:
          card:
            - background: >-
                linear-gradient(145deg, rgba(36, 43, 52, 0.96), rgba(23, 28, 35,
                0.96))
            - border: 1px solid rgba(255, 255, 255, 0.10)
            - border-left: '3px solid #e3a15c'
            - border-radius: 14px
            - padding: 11px 14px
            - box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12)
          grid:
            - grid-template-areas: '"i n s"'
            - grid-template-columns: 34px 1fr auto
            - align-items: center
          icon:
            - color: '#ffffff'
            - width: 23px
          name:
            - color: '#f4f6f8'
            - font-size: 15px
            - font-weight: 700
            - justify-self: start
          state:
            - color: |
                [[[
                  const s = entity?.state;
                  return ['on','running','online'].includes(s) ? '#78c8b2' :
                    ['off','stopped','offline'].includes(s) ? '#e17d7d' : '#e8b46b';
                ]]]
            - font-size: 10px
            - font-weight: 700
      - type: custom:mod-card
        card:
          type: grid
          columns: 3
          square: false
          cards:
            - type: custom:button-card
              entity: sensor.cloudflared___cc_cpu_usage
              name: CPU
              icon: mdi:cpu-64-bit
              show_state: true
              tap_action:
                action: more-info
              styles:
                card:
                  - padding: 10px 4px
                  - background: transparent
                  - border: none
                  - border-radius: '0'
                  - box-shadow: none
                  - padding: 9px 4px
                icon:
                  - color: '#ffffff'
                  - width: 20px
                name:
                  - color: rgba(231, 235, 240, 0.68)
                  - font-size: 11px
                state:
                  - color: '#f4f6f8'
                  - font-size: 13px
                  - font-weight: 700
            - type: custom:button-card
              entity: sensor.cloudflared___cc_memory_usage
              name: RAM · GiB
              icon: mdi:memory
              show_state: true
              state_display: |
                [[[
                  const value = Number(entity?.state);
                  if (!Number.isFinite(value)) return entity?.state ?? '—';
                  const unit = String(entity?.attributes?.unit_of_measurement ?? '').trim().toLowerCase();
                  let gib = value;
                  if (['b', 'byte', 'bytes'].includes(unit)) gib = value / 1073741824;
                  else if (['kib', 'kibibyte', 'kibibytes'].includes(unit)) gib = value / 1048576;
                  else if (['mib', 'mebibyte', 'mebibytes'].includes(unit)) gib = value / 1024;
                  else if (['kb', 'kilobyte', 'kilobytes'].includes(unit)) gib = value / 1000000;
                  else if (['mb', 'megabyte', 'megabytes'].includes(unit)) gib = value / 1000;
                  else if (['gb', 'gigabyte', 'gigabytes'].includes(unit)) gib = value / 1.073741824;
                  return gib.toFixed(2) + ' GiB';
                ]]]
              tap_action:
                action: more-info
              styles:
                card:
                  - padding: 10px 4px
                  - background: transparent
                  - border: none
                  - border-radius: '0'
                  - box-shadow: none
                  - padding: 9px 4px
                icon:
                  - color: '#ffffff'
                  - width: 20px
                name:
                  - color: rgba(231, 235, 240, 0.68)
