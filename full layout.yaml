  - type: custom:bubble-card
    close_on_click: false
    card_type: pop-up
    popup_mode: default
    hash: '#rack-ha'
    name: Home Assistant
    icon: mdi:server
    show_header: true
    width_desktop: 680px
    cards:
      - type: vertical-stack
        cards:
          - type: grid
            columns: 3
            square: false
            cards:
              - type: gauge
                entity: sensor.system_monitor_processor_use
                name: CPU
                min: 0
                max: 100
                needle: true
                severity:
                  green: 0
